<!doctype html>
<html>
  <head>
    <title>Admin Forgot Password</title>

    <style>
      body {
        background: url("{{url_for('static',filename='loginpage.jpeg')}}")
          no-repeat center center fixed;

        background-size: cover;

        margin: 0;
        padding: 0;

        font-family: Arial, sans-serif;

        height: 100vh;

        position: relative;

        overflow: hidden;
      }

      /* ===== FORGOT CARD ===== */
      body{
      background: url("{{url_for('static',filename='loginpage.jpeg')}}")no-repeat center center fixed;
      background-size: cover;
      margin:0;
      padding:0;
      font-family:Arial,sans-serif;
      height:100vh;
      display:flex;
      justify-content:right;
      align-items:center;
      }
      form{
      background:rgba(255,255,255,0.92);
      padding:25px;
      width:350px;
      border-radius:15px;
      text-align:center;
      position:absolute;
      top:62.5%;
      left:38%;
      transform:translate(80%,-58.5%);
      background:rgba(255,255,255,0.15);
      backdrop-filter:blur(5px);
      border-radius:15px;
      box-shadow:0 8px 25px rgba(0,0,0,0.3);
      }

      h1{
      margin-bottom:20px;
      color:#0f172a;
      font-size:26px;
      }
      input{
      width:90%;
      padding:12px;
      margin:10px,0;
      border-radius:8px;
      border:1px solid #ccc;
      font-size:15px;
      transition:0.3s;
      }
      input:focus{
      border-color:#2563eb;
      outline:none;
      box-shadow:0 0 6px rgba(37,99,235,0.5);
      }
      button
      {
      width:95%;
      padding:12px;
      background:#2563eb;
      color:white;
      border:none;
      border-raidus:8px;
      font-size:16px;
      cursor:pointer;
      margin-top:10px;
      transition:0.3s;
      }
      button:hover{
      background:#1d4ed8;
      transform:scale(1.03);
      }
      p{
      margin-top:15px;
      font-size:14px;
      }
      a{
      text-decoratation;none;
      color:#2563eb;
      font-weight:bold;
      }
      a:hover{
      text-decoration:underline;
      }
      /* ===== POPUP ===== */

      .popup {
        position: fixed;

        top: 25px;

        left: 50%;

        transform: translateX(-50%);

        padding: 15px 35px;

        border-radius: 12px;

        color: white;

        font-size: 22px;

        font-weight: bold;

        z-index: 9999;

        animation: fadeout 1s forwards;

        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.35);
      }

      .success {
        background: #22c55e;
      }

      .error {
        background: #ef4444;
      }

      /* ===== POPUP HIDE ===== */

      @keyframes fadeout {
        0% {
          opacity: 1;
        }

        70% {
          opacity: 1;
        }

        100% {
          opacity: 0;
        }
      }
    </style>
  </head>

  <body>
    <!-- ===== FLASH MESSAGE ===== -->

    {% with messages = get_flashed_messages(with_categories=true) %} {% if
    messages %} {% for category, message in messages %}

    <div class="popup {{ category }}">{{ message }}</div>

    {% endfor %} {% endif %} {% endwith %}

    <!-- ===== ADMIN FORGOT PASSWORD FORM ===== -->

    <form action="{{url_for('admin_forgot_password')}}" method="POST">
      <h1>ADMIN FORGOT PASSWORD ?</h1>

      <input
        type="email"
        name="email"
        placeholder="Enter Admin Email"
        value="{{ request.form.get('email', '') }}"
        required
      />

      <br /><br />

      <input
        type="text"
        name="username"
        placeholder="Enter Admin Username"
        value="{{ request.form.get('username', '') }}"
        required
      />

      <br /><br />

      <button type="submit">Submit</button>

      <button
        type="button"
        onclick="location.href='{{ url_for('admin_login') }}'"
      >
        Back
      </button>
    </form>

    <!-- ===== AUTO REDIRECT ===== -->

    {% if redirect_to_change %}

    <script>
      setTimeout(() => {
        window.location.href = "/admin_change_password";
      }, 1000);
    </script>

    {% endif %}
  </body>
</html>
