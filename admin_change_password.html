<!doctype html>
<html>
  <head>
    <title>Admin Change Password</title>

    <style>
      body {
        background: url("{{url_for('static',filename='loginpage.jpeg')}}")
          no-repeat center center fixed;

        background-size: cover;

        margin: 0;
        padding: 0;

        font-family: Arial, sans-serif;

        height: 100vh;

        display: flex;
        justify-content: right;
        align-items: center;
      }

      /* ===== FORM ===== */

      form {
        padding: 25px;

        width: 350px;

        border-radius: 15px;

        text-align: center;

        position: absolute;

        top: 64.7%;
        left: 38%;

        transform: translate(80%, -58.5%);

        background: rgba(255, 255, 255, 0.15);

        backdrop-filter: blur(12px);

        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      }

      /* ===== HEADING ===== */

      h1 {
        margin-bottom: 20px;

        color: #0f172a;

        font-size: 28px;

        font-weight: bold;
      }

      /* ===== INPUT ===== */

      input {
        width: 100%;

        padding: 12px;

        margin: 10px 0;

        border-radius: 8px;

        border: 1px solid #ccc;

        font-size: 15px;

        transition: 0.3s;

        box-sizing: border-box;
      }

      input:focus {
        outline: none;

        border-color: #2563eb;

        box-shadow: 0 0 8px rgba(37, 99, 235, 0.5);
      }

      /* ===== PASSWORD BOX ===== */

      .password-box {
        position: relative;

        width: 100%;

        display: flex;

        align-items: center;
      }

      .password-box input {
        width: 100%;

        padding: 12px 40px 12px 12px;

        border-radius: 8px;

        border: none;

        outline: none;

        font-size: 14px;

        box-sizing: border-box;
      }

      /* ===== EYE ICON ===== */

      .password-box span {
        position: absolute;

        right: 12px;

        top: 50%;

        transform: translateY(-50%);

        cursor: pointer;

        color: black;

        font-size: 16px;

        line-height: 1;
      }

      /* ===== BUTTON ===== */

      button {
        width: 100%;

        padding: 12px;

        background: #2563eb;

        color: white;

        border: none;

        border-radius: 8px;

        font-size: 16px;

        cursor: pointer;

        margin-top: 10px;

        transition: 0.3s;
      }

      button:hover {
        background: #1d4ed8;

        transform: scale(1.03);
      }

      /* ===== POPUP ===== */

      .popup {
        position: fixed;

        top: 25px;

        left: 50%;

        transform: translateX(-50%);

        padding: 16px 40px;

        border-radius: 14px;

        color: white;

        font-size: 20px;

        font-weight: bold;

        z-index: 9999;

        opacity: 1;

        transition: opacity 0.5s ease;

        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      }

      .success {
        background: #22c55e;
      }

      .error {
        background: #ef4444;
      }
    </style>
  </head>

  <body>
    <!-- ===== POPUP MESSAGE ===== -->

    {% if message %}

    <div class="popup {{ category }}">{{ message }}</div>

    {% endif %}

    <!-- ===== ADMIN CHANGE PASSWORD FORM ===== -->

    <form action="/admin_reset_password" method="POST">
      <h1>ADMIN CHANGE PASSWORD</h1>

      <div class="password-box">
        <input
          type="password"
          name="new_password"
          placeholder="Enter New Admin Password"
          required
        />

        <span onclick="togglePassword(this)">👁</span>
      </div>

      <div class="password-box">
        <input
          type="password"
          name="confirm_password"
          placeholder="Confirm Admin Password"
          required
        />

        <span onclick="togglePassword(this)">👁</span>
      </div>

      <br />

      <button type="submit">Change Password</button>

      <button
        type="button"
        onclick="location.href='{{ url_for('admin_forgot_password') }}'"
      >
        Back
      </button>
    </form>

    <!-- ===== SHOW / HIDE PASSWORD ===== -->

    <script>
      function togglePassword(el) {
        let input = el.previousElementSibling;

        input.type = input.type === "password" ? "text" : "password";
      }
    </script>

    <!-- ===== POPUP AUTO HIDE ===== -->

    <script>
      setTimeout(() => {
        let popup = document.querySelector(".popup");

        if (popup) {
          popup.style.opacity = "0";

          setTimeout(() => {
            popup.style.display = "none";
          }, 500);
        }
      }, 1000);
    </script>

    <!-- ===== AUTO REDIRECT ===== -->

    {% if redirect_to_login %}

    <script>
      setTimeout(() => {
        window.location.href = "/admin_login";
      }, 1000);
    </script>

    {% endif %}
  </body>
</html>
