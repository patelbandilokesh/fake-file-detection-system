<!doctype html>
<html>
  <head>
    <title>Fake File Detection System</title>

    <style>
      body {
        background: url("{{url_for('static',filename='loginpage.jpeg')}}")
          no-repeat center center fixed;
        background-size: cover;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        height: 100vh;
        display: flex;
        justify-content: right;
        align-items: center;
        position: relative;
      }

      form {
        padding: 18px;
        width: 350px;
        text-align: center;
        position: absolute;
        top: 59.8%;
        left: 38%;
        transform: translate(80%, -52.45%);
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(5px);
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      }

      h1 {
        margin-bottom: 20px;
        color: #0f172a;
        font-size: 26px;
      }

      input {
        width: 80%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 15px;
        transition: 0.3s;
      }

      input:focus {
        border-color: #2563eb;
        outline: none;
        box-shadow: 0 0 6px rgba(37, 99, 235, 0.5);
      }

      button {
        width: 95%;
        padding: 12px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
        transition: 0.3s;
      }

      button:hover {
        background: #1d4ed8;
        transform: scale(1.03);
      }

      p {
        margin-top: 15px;
        font-size: 14px;
      }

      a {
        text-decoration: none;
        color: #2563eb;
        font-weight: bold;
      }

      a:hover {
        text-decoration: underline;
      }

      .password-field {
        position: relative;
        width: 90%;
        margin: 10px auto;
      }

      .password-field input {
        width: 100%;
        padding: 12px;
        padding-right: 35px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 15px;
        box-sizing: border-box;
      }

      .eye-icon {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: black;
        font-size: 16px;
      }

      .back-btn {
        position: absolute;
        top: 20px;
        left: 20px;
        display: inline-block;
        width: auto;
        background: #2563eb;
        color: white;
        padding: 8px 16px;
        border-radius: 8px;
        text-decoration: none;
        font-size: 14px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }

      .back-btn:hover {
        background: #1d4ed8;
      }

      .flash {
        position: fixed;
        top: 10%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 18px 35px;
        border-radius: 12px;
        color: white;
        font-size: 20px;
        font-weight: bold;
        z-index: 9999;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        animation: popup 0.4s ease;
      }

      .flash.success {
        background: #22c55e;
      }

      .flash.error {
        background: #ef4444;
      }

      @keyframes popup {
        from {
          opacity: 0;
          transform: translate(-50%, -60%) scale(0.8);
        }

        to {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
      }
    </style>
  </head>

  <body>
    {% with messages = get_flashed_messages(with_categories=true) %} {% if
    messages %} {% for category, message in messages %}

    <div class="flash {{ category }}">{{ message }}</div>

    {% endfor %} {% endif %} {% endwith %}

    <!-- ADMIN LOGIN FORM -->

    <form action="{{url_for('admin_login')}}" method="POST">
      <h1>WELCOME ADMIN</h1>

      <input
        type="text"
        name="username"
        placeholder="Enter Admin name"
        value="{{ request.form.get('username', '') }}"
        required
      />

      <div class="password-field">
        <input
          type="password"
          name="password"
          placeholder="Enter Password"
          required
          id="password"
        />

        <span class="eye-icon" onclick="togglePassword()">👁</span>
      </div>

      <br />

      <button type="submit">Login</button>

      <p>
        New Admin?
        <a href="{{url_for('admin_register')}}">Register</a>
        here
      </p>

      <a href="{{url_for('admin_forgot_password')}}"> Forgot password </a>
      here
    </form>

    <!-- BACK BUTTON -->

    <a href="{{ url_for('home') }}">
      <button type="button" class="back-btn">Back</button>
    </a>

    <script>

      function togglePassword() {

        let input = document.getElementById("password");

        if (input.type === "password") {

          input.type = "text";

        } else {

          input.type = "password";

        }
      }

      /* HIDE FLASH MESSAGE */

      setTimeout(() => {

        let flash = document.querySelector(".flash");

        if (flash) {

          flash.style.opacity = "0";

          setTimeout(() => {

            flash.style.display = "none";

          }, 500);
        }

      }, 1200);

      /* SUCCESS REDIRECT */

      {% if redirect_to_dashboard %}

      setTimeout(() => {

        window.location.href = "/admin_page";

      }, 1500);

      {% endif %}
    </script>
  </body>
</html>
